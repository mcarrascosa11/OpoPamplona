name: Integrar preguntas E14

on:
  push:
    branches: [agent/e14-preguntas]

permissions:
  contents: write

jobs:
  append:
    if: github.event.head_commit.message != 'Integrar preguntas E14 en preguntas.js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Añadir preguntas y eliminar workflow temporal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          banco = Path('src/data/preguntas.js')
          fragmento = Path('scripts/e14-preguntas-fragmento.txt').read_text(encoding='utf-8')
          texto = banco.read_text(encoding='utf-8')
          pos = texto.rfind('];')
          if pos < 0:
              raise SystemExit('No se encontró el cierre del banco de preguntas')
          texto = texto[:pos].rstrip() + '\n\n' + fragmento + '\n' + texto[pos:]
          banco.write_text(texto, encoding='utf-8')
          PY
          rm .github/workflows/_tmp_add_e14.yml
          rm scripts/e14-preguntas-fragmento.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/preguntas.js .github/workflows/_tmp_add_e14.yml scripts/e14-preguntas-fragmento.txt
          git commit -m 'Integrar preguntas E14 en preguntas.js'
          git push
